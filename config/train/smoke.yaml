# A two-epoch joint run for smoke tests and CI. Everything is small; nothing
# here is a defensible experimental setting.
task: joint
targets:
  - blink_presence
  - eye_state

loss: bce
loss_kwargs: {}

max_epochs: 2

accelerator: auto
devices: auto
precision: 32-true
seed: 42
deterministic: false
output_dir: results

optimizer:
  name: adamw
  lr: 0.001
  backbone_lr: 0.0001
  weight_decay: 0.01
  scheduler: none
  warmup_ratio: 0.1
  gradient_clip_val: 1.0

early_stopping:
  enabled: false
  monitor: valid/mean_f1
  mode: max
  patience: 10
  min_delta: 0.0

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: blink-smoke
  run_name: null
  log_model: false
